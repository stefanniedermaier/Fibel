# Weekly update pull requests; every PR runs through "Check and deploy" and "Security".
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates together in one PR, majors one by one.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (native compiler) is not yet supported by typescript-eslint
      # (needs <6.1). Remove this once it is supported; TypeScript 6 is allowed.
      - dependency-name: typescript
        versions: ['>=7.0.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
