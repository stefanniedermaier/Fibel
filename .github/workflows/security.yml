name: Security

# Dependency checks, secret scanning and checks of the workflows themselves.
# Static code analysis (CodeQL) runs via GitHub's "default setup"
# (Settings → Advanced Security) – a CodeQL job here would conflict with it.
# The OpenSSF Scorecard has its own workflow (scorecard.yml).
# Runs on every push to main, on pull requests and weekly (new advisories appear
# even when the code does not change). Does not block deployments.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: npm audit (alle Abhängigkeiten)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      # Runtime dependencies: any severity (also checked before every deploy).
      - run: npm audit --omit=dev --audit-level=moderate
      # Build and test tools only run on the developer machine and in CI: high and critical.
      - run: npm audit --audit-level=high
      # Packages must come from the registry with valid signatures and provenance.
      - run: npm audit signatures
      # Licences of everything shipped to the device (allowlist, no copyleft).
      - run: npm run licenses:check

  dependency-review:
    name: Neue Abhängigkeiten prüfen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          # Copyleft licences would conflict with the MIT licence of the app.
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          # Flags new dependencies with a poor OpenSSF Scorecard (maintenance, security).
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 3
          comment-summary-in-pr: on-failure

  secrets:
    name: Geheimnisse im Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflows:
    name: Workflows prüfen (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Syntax, expressions, runner labels and the shell scripts in run steps (shellcheck).
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      # Security of the workflows: injections, unpinned actions, leaked credentials,
      # too broad permissions, cache poisoning.
      - name: zizmor
        run: pipx run --spec zizmor==1.33.1 zizmor --format=github .github/workflows
        env:
          # Online audits (e.g. known-vulnerable action versions) use the API.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
