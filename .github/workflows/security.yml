name: Security

# Dependency checks and secret scanning. Static code analysis (CodeQL) runs via
# GitHub's "default setup" (Settings → Advanced Security) – a CodeQL job here would
# conflict with it.
# Runs on every push to main, on pull requests and weekly (new advisories appear
# even when the code does not change). Does not block deployments.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: npm audit (alle Abhängigkeiten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Runtime dependencies: any severity (also checked before every deploy).
      - run: npm audit --omit=dev --audit-level=moderate
      # Build and test tools only run on the developer machine and in CI: high and critical.
      - run: npm audit --audit-level=high
      # Packages must come from the registry with valid signatures.
      - run: npm audit signatures

  dependency-review:
    name: Neue Abhängigkeiten prüfen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          # Copyleft licences would conflict with the MIT licence of the app.
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          comment-summary-in-pr: on-failure

  secrets:
    name: Geheimnisse im Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
