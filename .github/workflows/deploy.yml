name: Check and deploy

# Only version tags (v1.0.0 …) are published to GitHub Pages. Pushes to main and
# pull requests run the same checks without deploying.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Each branch/PR has its own queue (newer runs replace older ones). Releases share
# one queue and are never cancelled half-way through a deployment.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && 'pages' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zur Version in package.json ($expected)."
            exit 1
          fi
      # Quality: formatting, lint, data, tests (the type check runs in the build)
      - run: npm run format:check
      - run: npm run lint
      # Dictionaries and stroke templates: lauttreue rules, images, state adjustments
      - run: npm run data:check
      - run: npm test
      # Security: everything shipped to the device must be free of known vulnerabilities
      # (dev tools are checked separately in security.yml and do not block a deploy).
      - name: Known vulnerabilities in runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
        env:
          # Project pages live under /<repo-name>/
          BASE_PATH: /${{ github.event.repository.name }}/
      # "Nothing leaves the device": strict CSP, no external resources or connections
      - run: npm run dist:check
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
