name: Check and deploy

# Every push to main and every version tag (v1.0.0 …) is checked and published to
# GitHub Pages. Pull requests are only checked.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deployments share one queue (push to main and its tag arrive together);
# pull requests get their own.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zur Version in package.json ($expected)."
            exit 1
          fi
      - run: npm run lint
      # Dictionaries and stroke templates: lauttreue rules, images, state adjustments
      - run: npm run data:check
      - run: npm test
      - run: npm run build
        env:
          # Project pages live under /<repo-name>/
          BASE_PATH: /${{ github.event.repository.name }}/
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
